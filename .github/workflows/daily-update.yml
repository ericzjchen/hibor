name: HIBOR Data Update

on:
  schedule:
    - cron: '0,30 3-10 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  TZ: Asia/Hong_Kong

permissions:
  contents: write

jobs:
  update-hibor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        pip install selenium beautifulsoup4 requests webdriver-manager
        
    - name: Setup Chrome and ChromeDriver (Simplified)
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        
        # 安裝最新版Chrome
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -fy
        
        # 顯示Chrome版本
        CHROME_VERSION=$(google-chrome --version)
        echo "✅ Chrome installed: $CHROME_VERSION"
        
        # webdriver-manager會在運行時自動處理ChromeDriver
        
    - name: Run HKAB HIBOR update
      run: |
        echo "🕐 $(date)"
        echo "🚀 Running HKAB HIBOR update..."
        python scripts/update_hkab_hibor.py
        echo "✅ HKAB update completed"
        
    - name: Run HSBC HIBOR update
      run: |
        echo "🕐 $(date)"
        echo "🚀 Running HSBC HIBOR update..."
        python scripts/update_hsbc_hibor.py
        echo "✅ HSBC update completed"
        
    - name: Run Hang Seng HIBOR update
      run: |
        echo "🕐 $(date)"
        echo "🚀 Running Hang Seng HIBOR update..."
        python scripts/update_hase_hibor.py
        echo "✅ Hang Seng update completed"
        
    - name: Commit and push changes
      run: |
        git config --local user.email "ericzjchen@gmail.com"
        git config --local user.name "GitHub Actions"
        
        git add api/hase_hibor.json api/hkab_hibor.json api/hsbc_hibor.json
        
        if git diff --staged --quiet; then
          echo "🤷 No changes to commit"
        else
          git commit -m "🤖 Auto-update HIBOR data at $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "✅ Changes committed and pushed"
        fi